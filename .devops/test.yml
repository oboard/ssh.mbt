version: 2
name: test
description: ""
global:
  concurrent: 1
trigger:
  webhook: gitlink@1.0.0
  event:
    - ref: push
      ruleset-operator: AND
workflow:
  - ref: start
    name: 开始
    task: start
  - ref: git_clone_0
    name: git clone
    task: git_clone@1.2.9
    input:
      remote_url: '""'
      ref: '"refs/heads/master"'
      commit_id: '""'
      depth: 1
    needs:
      - start
  - ref: Setup Moon env (Linux) and Moon Check and Test
    name: Setup Moon env (Linux) and Moon Check and Test
    image: docker.jianmuhub.com/library/ubuntu:22.04
    script:
      - sudo apt-get update
      - sudo apt-get install -y gcc libssl-dev
      - curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - export PATH="$HOME/.moon/bin:$PATH"
      - moon fmt --check
      - moon check --deny-warn
      - moon info
      - git diff --exit-code
      - git status
      - echo moon test
      - moon test --deny-warn --enable-coverage
      - moon coverage report -f summary
      - ""
      - moon coverage analyze
      - ""
      - "# ffi test"
      - echo moon test native
      - moon test --deny-warn --target native --enable-coverage
      - moon coverage report -f summary
      - ""
      - moon coverage analyze
    needs:
      - git_clone_0
    - ref: end
      name: 结束
      task: end
      needs:
        - Setup Moon env (Linux) and Moon Check and Test

