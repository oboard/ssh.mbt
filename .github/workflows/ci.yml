name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Moon env
        run: |
          apt-get update && apt-get install -y gcc libssl-dev
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon fmt --check
        run: moon fmt --check

      - name: moon check
        run: moon check

      - name: moon info && git diff --exit-code
        run: |
          moon info
          git diff --exit-code
          git status

      - name: moon test
        run: |
          echo moon test
          moon test --enable-coverage
          moon coverage report -f summary

          # ffi test
          echo moon test native
          moon test --target native --enable-coverage
          moon coverage report -f summary

      - name: Monon coverage
        run: moon coverage analyze

      - name: Run ssh-server scripts, start ssh server
        run: |
          set -e

          echo "Running ssh-server scripts..."

          cd scripts/ssh-server/
          chmod +x *.sh

          for f in *.sh; do
            echo "==> Running $f"
            bash "$f"
          done

      - name: Run cmd/password sequentially, run moon connect to ssh server
        run: |
          set -e

          echo "Running cmd/password run.sh..."
          export workspace=$(pwd)

          cd cmd/password
          chmod +x run.sh
          bash run.sh

      - name: Run cmd/key sequentially, run moon connect to ssh server
        run: |
          set -e

          echo "Running cmd/key run_xx.sh..."
          export workspace=$(pwd)

          cd cmd/key
          chmod +x *.sh

          for f in *.sh; do
            echo "==> Running $f"
            bash "$f"
          done
      
      - name: Run cmd/sftp sequentially, run moon connect to ssh server and file & directory operations
        run: |
          set -e

          echo "Running cmd/sftp run.sh..."
          export workspace=$(pwd)

          cd cmd/sftp
          chmod +x run.sh
          bash run.sh

      - name: Run cmd/forwarding sequentially, run moon connect to ssh server and port forwarding
        run: |
          set -e
          
          echo "Running cmd/forwarding run.sh..."
          export workspace=$(pwd)
          
          cd cmd/forwarding
          chmod +x run.sh
          bash run.sh &
          RUN_PID=$!
          echo "run.sh started with PID $RUN_PID"

          sleep 5
          docker exec openssh-server_forwarding curl -vv http://127.0.0.1:8080

          kill $RUN_PID 2>/dev/null || true

      - name: Tokei
        run: docker run --rm -v $(pwd):/src ghcr.io/xampprocky/tokei:latest .
