name: Integration

on:
  push:
  pull_request:

jobs:
  integration:
    name: SSH cmd integration (Linux)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Moon env
        run: |
          apt-get update && apt-get install -y gcc libssl-dev
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Run ssh-server scripts, start ssh server
        run: |
          set -e

          echo "Running ssh-server scripts..."

          cd scripts/ssh-server/
          chmod +x *.sh

          for f in *.sh; do
            echo "==> Running $f"
            bash "$f"
          done

      - name: Run cmd/password sequentially, run moon connect to ssh server
        run: |
          set -e

          echo "Running cmd/password run.sh..."
          export workspace=$(pwd)

          cd cmd/password
          chmod +x run.sh
          bash run.sh

      - name: Run cmd/key sequentially, run moon connect to ssh server
        run: |
          set -e

          echo "Running cmd/key run_xx.sh..."
          export workspace=$(pwd)

          cd cmd/key
          chmod +x *.sh

          for f in *.sh; do
            echo "==> Running $f"
            bash "$f"
          done

      - name: Run cmd/sftp sequentially, run moon connect to ssh server and file & directory operations
        run: |
          set -e

          echo "Running cmd/sftp run.sh..."
          export workspace=$(pwd)

          cd cmd/sftp
          chmod +x run.sh
          bash run.sh

      - name: Test remote forwarding (-R)
        run: |
          set -e
          echo "Running cmd/forwarding run-remote.sh..."
          export workspace=$(pwd)

          cd cmd/forwarding
          chmod +x run-remote.sh
          bash run-remote.sh &
          RUN_PID=$!
          echo "run-remote.sh started with PID $RUN_PID"

          sleep 5
          docker exec openssh-server_forwarding curl -vv http://127.0.0.1:8080

          kill $RUN_PID 2>/dev/null || true

      - name: Test local forwarding (-L)
        run: |
          set -e
          echo "Running cmd/forwarding run-local.sh..."
          export workspace=$(pwd)

          cd cmd/forwarding
          chmod +x run-local.sh
          bash run-local.sh &
          RUN_PID=$!
          echo "run-local.sh started with PID $RUN_PID"

          sleep 5
          curl -vv http://127.0.0.1:2080
          echo "Local forwarding OK"

          kill $RUN_PID 2>/dev/null || true

      - name: Test SOCKS5 proxy (-D)
        run: |
          set -e
          echo "Running cmd/forwarding run-socks5.sh..."
          export workspace=$(pwd)

          # 获取 Docker 网关 IP
          GATEWAY_IP=$(docker exec openssh-server_forwarding ip route show default | awk '{print $3}')
          echo "SOCKS5 target: $GATEWAY_IP:1080"

          cd cmd/forwarding
          chmod +x run-socks5.sh
          bash run-socks5.sh &
          RUN_PID=$!
          echo "run-socks5.sh started with PID $RUN_PID"

          sleep 5
          curl -vv --socks5 127.0.0.1:3080 http://$GATEWAY_IP:1080
          echo "SOCKS5 proxy OK"

          kill $RUN_PID 2>/dev/null || true

      - name: Tokei
        run: docker run --rm -v $(pwd):/src ghcr.io/xampprocky/tokei:latest .